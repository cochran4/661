          - text: "Why statistics is not enough"
            file: 01b-why-statistics-is-not-enough.qmd
          - text: "Clinical trials as our exemplar"
            file: 01c-clinical-trials.qmd
          - text: "Probability gives us a formal language"
            file: 01d-probability.qmd
          - text: "Exercises"
            file: 01e-exercises.qmd
      - text: "Back matter"
        menu:
          - text: "Glossary"
            file: glossary.qmd
          - text: "References"
            file: references.qmd
