project:
  type: book


book:
  title: "Causal inference (and other things)"
  author: "Amy Cochran"
  chapters:
    - index.qmd
    - 00-syllabus.qmd
    - part: "Motivation"
      chapters:
        - 01-data-detective.qmd
        - 02-why-statistics-is-not-enough.qmd
        - 03-clinical-trials.qmd
    - part: "Construction"
      chapters: []
    - part: "Measured confounding"
      chapters: []
    - part: "Unmeasured confounding"
      chapters: []
    - part: "Sensitivity analysis"
      chapters: []
    - part: "Missing data"
      chapters: []
    - part: "Complex surveys"
      chapters: []
    - part: "Back matter"
      chapters:
        - glossary.qmd
        - references.qmd
  navbar:
    pinned: true
    search: true
    left:
      - text: "Home"
        file: index.qmd
      - text: "Syllabus"
        file: 00-syllabus.qmd
      - text: "Motivation"
        menu:
          - text: "A detective among data"
            file: 01-data-detective.qmd
          - text: "Why statistics is not enough"
            file: 02-why-statistics-is-not-enough.qmd
          - text: "Clinical trials"
            file: 03-clinical-trials.qmd
      - text: "Back matter"
        menu:
          - text: "Glossary"
            file: glossary.qmd
          - text: "References"
            file: references.qmd
  search:
    location: navbar
    type: overlay
  sidebar: false

bibliography: references.bib
link-citations: true

format:
  html:
    theme:
      - cosmo
      - styles.scss
    include-after-body: tooltip-init.html
    toc: false
