      chapters:
        - 01a-being-a-detective.qmd
        - 01b-why-statistics-is-not-enough.qmd
        - 01c-clinical-trials.qmd
        - 01d-probability.qmd
        - 01e-exercises.qmd
    - part: "Construction"
      chapters: []
    - part: "Measured confounding"
      chapters: []
    - part: "Unmeasured confounding"
      chapters: []
    - part: "Sensitivity analysis"
      chapters: []
    - part: "Missing data"
      chapters: []
    - part: "Complex surveys"
      chapters: []
    - part: "Back matter"
