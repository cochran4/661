<text x="75" y="53" text-anchor="middle" font-family="Georgia,serif" font-size="42" fill="#A5425E">$</text>
</g>
<g stroke="#315C43" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
<circle cx="845" cy="130" r="24" fill="white"/>
<path d="M845 156 L845 223 M845 190 Q820 195 795 173 M845 190 Q870 175 889 149 M845 223 L811 263 M845 223 L880 263"/>
</g>
<g stroke="#718174" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
