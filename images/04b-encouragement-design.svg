<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title description">
<title id="title">Encouraged and not encouraged</title>
<desc id="description">An encouraged person is offered a voucher to try an intervention. A second person is asked to try the intervention without a voucher, matching the original encouragement illustration.</desc>
<rect width="1000" height="600" fill="white"/>
<rect x="20" y="20" width="960" height="265" rx="16" fill="#F7FAF4" stroke="#D7E0D3"/>
<rect x="20" y="315" width="960" height="265" rx="16" fill="#FFFDF9" stroke="#E4DDD1"/>
<g font-family="Georgia,serif" fill="#244635">
<text x="55" y="67" font-size="29">Encouraged</text>
<text x="55" y="362" font-size="29">Not encouraged</text>
<text x="80" y="141" font-size="27">“Here’s a voucher</text>
<text x="80" y="185" font-size="27">to try this intervention.”</text>
<text x="80" y="438" font-size="27">“Please try</text>
<text x="80" y="482" font-size="27">this intervention.”</text>
</g>
<g transform="translate(535 110) rotate(-8 75 40)">
