<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">A random variable maps possible outcomes to the real line</title>
  <desc id="desc">Three possible outcomes in the sample space Omega are mapped by a random variable X to values on the real number line. Two different outcomes map to the same value, illustrating that each outcome has one numerical output but different outcomes may share an output.</desc>
  <defs>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9c36b5"/></marker>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1e1e1e"/></marker>
    <style>
      .text { font: 21px system-ui, sans-serif; fill: #1e1e1e; }
      .small { font: 18px system-ui, sans-serif; fill: #1e1e1e; }
      .purple { font: 22px system-ui, sans-serif; fill: #862e9c; }
    </style>
  </defs>
  <ellipse cx="190" cy="235" rx="150" ry="178" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2.5"/>
  <text x="190" y="93" text-anchor="middle" class="text">Ω</text>
  <text x="190" y="120" text-anchor="middle" class="small">possible outcomes</text>
  <circle cx="110" cy="180" r="9" fill="#74c0fc" stroke="#1971c2" stroke-width="2"/>
  <circle cx="185" cy="260" r="9" fill="#74c0fc" stroke="#1971c2" stroke-width="2"/>
  <circle cx="253" cy="330" r="9" fill="#74c0fc" stroke="#1971c2" stroke-width="2"/>
  <text x="462" y="66" text-anchor="middle" class="purple">random variable</text>
  <text x="462" y="96" text-anchor="middle" class="purple">X : Ω → ℝ</text>
  <path d="M120 180 C300 105 470 125 628 250" fill="none" stroke="#9c36b5" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <path d="M195 260 C370 210 575 210 788 250" fill="none" stroke="#9c36b5" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <path d="M263 330 C450 395 630 345 788 250" fill="none" stroke="#9c36b5" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <line x1="565" y1="250" x2="945" y2="250" stroke="#1e1e1e" stroke-width="2.5" marker-start="url(#arrow-black)" marker-end="url(#arrow-black)"/>
  <text x="755" y="174" text-anchor="middle" class="text">ℝ</text>
  <text x="755" y="201" text-anchor="middle" class="small">real numbers</text>
  <line x1="630" y1="238" x2="630" y2="262" stroke="#1e1e1e" stroke-width="2"/>
  <line x1="710" y1="238" x2="710" y2="262" stroke="#1e1e1e" stroke-width="2"/>
  <line x1="790" y1="238" x2="790" y2="262" stroke="#1e1e1e" stroke-width="2"/>
  <line x1="870" y1="238" x2="870" y2="262" stroke="#1e1e1e" stroke-width="2"/>
  <text x="630" y="291" text-anchor="middle" class="text">−1</text>
  <text x="710" y="291" text-anchor="middle" class="text">0</text>
  <text x="790" y="291" text-anchor="middle" class="text">1</text>
  <text x="870" y="291" text-anchor="middle" class="text">2</text>
  <text x="500" y="440" text-anchor="middle" class="small">Each possible outcome is assigned exactly one real number; different outcomes may be assigned the same number.</text>
</svg>
