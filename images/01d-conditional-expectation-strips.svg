<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Estimating conditional expectations from observed data</title>
  <desc id="desc">Two scatterplots of observed blood pressure against age. The first highlights a narrow strip of ages and the center of the observed blood pressures within it. The second shows the estimated conditional mean curve formed by repeating this process and a simpler regression line.</desc>
  <defs>
    <style>
      .heading { font: 700 23px system-ui, sans-serif; fill: #202124; }
      .label { font: 17px system-ui, sans-serif; fill: #202124; }
      .small { font: 15px system-ui, sans-serif; fill: #4b5563; }
      .axis { stroke: #202124; stroke-width: 2; }
      .frame { fill: #ffffff; stroke: #c9ced6; stroke-width: 1.5; }
      .point { fill: #667085; opacity: 0.55; }
      .selected { fill: #c96328; opacity: 0.9; }
      .strip { fill: #ffddb8; opacity: 0.55; }
      .mean { stroke: #c96328; stroke-width: 4; }
      .mean-dot { fill: #c96328; stroke: #ffffff; stroke-width: 2; }
      .curve { fill: none; stroke: #2878b5; stroke-width: 5; stroke-linecap: round; }
      .fit { fill: none; stroke: #7b4ab5; stroke-width: 4; stroke-dasharray: 10 7; }
      .guide { stroke: #2878b5; stroke-width: 1.5; stroke-dasharray: 5 5; opacity: 0.55; }
    </style>
    <g id="points">
      <circle cx="80" cy="304" r="5"/><circle cx="94" cy="276" r="5"/><circle cx="108" cy="325" r="5"/>
      <circle cx="126" cy="267" r="5"/><circle cx="143" cy="297" r="5"/><circle cx="158" cy="244" r="5"/>
      <circle cx="176" cy="286" r="5"/><circle cx="191" cy="253" r="5"/><circle cx="207" cy="309" r="5"/>
      <circle cx="225" cy="235" r="5"/><circle cx="239" cy="270" r="5"/><circle cx="253" cy="219" r="5"/>
      <circle cx="270" cy="258" r="5"/><circle cx="284" cy="202" r="5"/><circle cx="299" cy="242" r="5"/>
      <circle cx="317" cy="183" r="5"/><circle cx="332" cy="228" r="5"/><circle cx="347" cy="194" r="5"/>
      <circle cx="363" cy="151" r="5"/><circle cx="379" cy="207" r="5"/><circle cx="393" cy="169" r="5"/>
      <circle cx="408" cy="126" r="5"/><circle cx="424" cy="185" r="5"/><circle cx="439" cy="142" r="5"/>
      <circle cx="455" cy="105" r="5"/><circle cx="470" cy="160" r="5"/><circle cx="486" cy="118" r="5"/>
    </g>
  </defs>

  <text x="285" y="38" text-anchor="middle" class="heading">Find the center within one narrow strip</text>
  <rect x="60" y="65" width="450" height="350" class="frame"/>
  <rect x="246" y="66" width="48" height="348" class="strip"/>
  <g class="point"><use href="#points"/></g>
  <g class="selected">
    <circle cx="253" cy="219" r="6"/><circle cx="270" cy="258" r="6"/><circle cx="284" cy="202" r="6"/>
  </g>
  <line x1="246" y1="226" x2="294" y2="226" class="mean"/>
  <circle cx="270" cy="226" r="7" class="mean-dot"/>
  <text x="304" y="220" class="small">estimated mean near this age</text>
  <line x1="60" y1="415" x2="510" y2="415" class="axis"/>
  <line x1="60" y1="65" x2="60" y2="415" class="axis"/>
  <text x="285" y="458" text-anchor="middle" class="label">age, X</text>
  <text x="20" y="240" text-anchor="middle" class="label" transform="rotate(-90 20 240)">blood pressure, Y</text>
  <text x="270" y="482" text-anchor="middle" class="small">average the outcomes within the strip</text>

  <text x="825" y="38" text-anchor="middle" class="heading">Repeat and model the pattern</text>
  <rect x="600" y="65" width="450" height="350" class="frame"/>
  <g class="point" transform="translate(540 0)"><use href="#points"/></g>
  <line x1="690" y1="415" x2="690" y2="279" class="guide"/>
  <line x1="775" y1="415" x2="775" y2="244" class="guide"/>
  <line x1="860" y1="415" x2="860" y2="205" class="guide"/>
  <line x1="945" y1="415" x2="945" y2="157" class="guide"/>
  <path d="M620 303 C690 288 745 261 800 232 C865 198 920 169 1030 128" class="curve"/>
  <path d="M620 315 L1030 119" class="fit"/>
  <circle cx="690" cy="279" r="6" class="mean-dot"/>
  <circle cx="775" cy="244" r="6" class="mean-dot"/>
  <circle cx="860" cy="205" r="6" class="mean-dot"/>
  <circle cx="945" cy="157" r="6" class="mean-dot"/>
  <text x="914" y="92" text-anchor="middle" class="label">estimated E[Y | X]</text>
  <text x="956" y="215" text-anchor="middle" class="small">a regression line</text>
  <line x1="600" y1="415" x2="1050" y2="415" class="axis"/>
  <line x1="600" y1="65" x2="600" y2="415" class="axis"/>
  <text x="825" y="458" text-anchor="middle" class="label">age, X</text>
  <text x="560" y="240" text-anchor="middle" class="label" transform="rotate(-90 560 240)">blood pressure, Y</text>
  <text x="825" y="482" text-anchor="middle" class="small">the local centers estimate the conditional mean function</text>
</svg>
