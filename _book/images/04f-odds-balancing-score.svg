<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 390" role="img" aria-labelledby="title desc">
<title id="title">Treatment assignment through an odds balancing score</title>
<desc id="desc">X and U determine treatment odds. X and those odds determine treatment assignment probabilities. X, U, and A point to Y.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#315C43" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g fill="none" stroke="#315C43" stroke-width="2.2" marker-end="url(#arrow)">
<path d="M114 91 L244 170"/>
<path d="M114 289 L244 210"/>
<path d="M120 70 L449 70"/>
<path d="M337 168 L456 92"/>
<path d="M112 46 C320 -5 685 0 660 269"/>
<path d="M121 310 L619 310"/>
<path d="M516 100 L638 277"/>
</g>
<g stroke="#315C43" stroke-width="1.8">
<circle cx="80" cy="70" r="38" fill="#E6EEDF"/>
<circle cx="80" cy="310" r="38" fill="#FFFDF9" stroke-dasharray="6 4"/>
<ellipse cx="290" cy="190" rx="58" ry="42" fill="#FFFDF9" stroke-dasharray="6 4"/>
<ellipse cx="290" cy="190" rx="53" ry="37" fill="none" stroke-width="1"/>
<circle cx="490" cy="70" r="38" fill="#E6EEDF"/>
<circle cx="660" cy="310" r="38" fill="#E6EEDF"/>
</g>
<g text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="25" fill="#244635">
<text x="80" y="70" dy=".34em">X</text>
<text x="80" y="310" dy=".34em">U</text>
<text x="290" y="190" dy=".34em">o(X,U)</text>
<text x="490" y="70" dy=".34em">A</text>
<text x="660" y="310" dy=".34em">Y</text>
</g>
</svg>
