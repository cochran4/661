 <title>From matching reuse to inverse probability weights</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>From matching reuse to inverse probability weights</dc:title>
    <dc:date>2026-10-25T15:35:58.042428</dc:date>
    <dc:description>Acorn icons represent individuals. Left: two outlined untreated acorns each choose the filled treated acorn, Hickory, as their single match, giving him matching weight 3. Right: one filled acorn labeled Hickory and four faded copies show five units of representation at propensity score 0.20, giving IPW weight 5. The faded copies represent additional weight, not additional observations.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <cc:Agent>
      <dc:title>Matplotlib v3.9.4, https://matplotlib.org/</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
 </metadata>
